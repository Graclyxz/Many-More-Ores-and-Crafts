plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${forge_version}")
}

minecraft {
    // Automatically enable Forge AccessTransformers if the file exists.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at)
    }

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('runs/client')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('runs/data')
            args '--mod', mod_id,
                 '--all',
                 '--output', layout.projectDirectory.dir('src/generated/resources'),
                 '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

jar {
    manifest {
        attributes['MixinConfigs'] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// ForgeGradle 7 adds the forge sourceSet's classes dir and resources dir to the
// run module-path as SEPARATE entries. ModLauncher then registers the classes
// dir as an automatic module ("main") and the resources dir (which holds
// mods.toml) as the mod module ("many_more_ores_and_crafts"), so the same
// packages get claimed by two modules -> JPMS split-package crash at boot.
// Collapsing classes + resources into a single output directory makes
// ModLauncher see ONE module. (Same fix the official MultiLoader-Template uses.)
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
