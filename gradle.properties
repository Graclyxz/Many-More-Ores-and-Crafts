# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.graclyxz.many_more_ores_and_crafts
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Many More Ores and Crafts
mod_author=Graclyxz
mod_id=many_more_ores_and_crafts
license=MIT LICENSE
credits=
description=Adds 14 ores and recipes (Swords, Armors, Tools and Blocks)
minecraft_version_range=[26.1.2, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1
# Parchment mappings — disabled for the 26.1.2 port. The 1.21.5 mappings do not
# apply to 26.1.2; re-enable when ParchmentMC publishes a 26.1.2 release at
# https://parchmentmc.org/docs/getting-started by adding both keys here AND the
# parchment block in common/build.gradle (and a layered mappings entry in fabric/build.gradle).
# parchment_minecraft=...
# parchment_version=...

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)

# Forge, see https://files.minecraftforge.net/ for new versions
forge_version=26.1.2-64.0.8
forge_version_range=[64.0.0,)
forge_loader_version_range=[62,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
